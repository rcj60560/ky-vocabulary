<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考研英语二真题单词频率统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-section {
            padding: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #f0f1f3 100%);
            border-bottom: 2px solid #dee2e6;
        }

        .search-box-wrapper {
            margin-bottom: 20px;
        }

        .search-label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .search-input-container {
            position: relative;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2), 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .search-input::placeholder {
            color: #999;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .control-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .control-item label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            white-space: nowrap;
        }

        .control-item input,
        .control-item select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        .control-item input:focus,
        .control-item select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        .info-bar {
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .info-item {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
            color: #333;
        }

        .info-value {
            font-weight: 700;
            color: #667eea;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #dee2e6;
            background: #f8f9fa;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: #e9ecef;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f0f1f3;
            position: sticky;
            top: 0;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            border-bottom: 2px solid #ddd;
        }

        th:hover {
            background: #e0e2e7;
        }

        th.sortable::after {
            content: ' ⇅';
            opacity: 0.5;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: top;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .word-cell {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .word-cell:hover {
            text-decoration: underline;
            color: #764ba2;
            background: rgba(102, 126, 234, 0.1);
        }

        .year-badge {
            display: inline-block;
            background: #e7f3ff;
            color: #0066cc;
            padding: 2px 8px;
            border-radius: 3px;
            margin: 2px 2px;
            font-size: 11px;
            font-weight: 600;
        }

        .word-forms {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
            font-style: italic;
        }

        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            transition: all 0.2s;
        }

        .star-btn:hover {
            transform: scale(1.2);
        }

        .star-btn.starred {
            color: #ffc107;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
            padding: 20px 0;
            align-items: center;
        }

        .pagination button,
        .pagination select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background: #f0f1f3;
            border-color: #667eea;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }

        .no-results {
            padding: 40px;
            text-align: center;
            color: #999;
            font-size: 16px;
        }

        .definition-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 900;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .definition-modal.active {
            display: flex;
        }

        .definition-content {
            background: white;
            border-radius: 10px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #333;
        }

        .definition-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
        }

        .definition-section {
            margin-bottom: 20px;
        }

        .definition-label {
            font-size: 13px;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .definition-text {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .definition-example {
            background: #f8f9fa;
            padding: 10px;
            border-left: 3px solid #667eea;
            margin: 10px 0;
            font-size: 13px;
            font-style: italic;
            color: #555;
        }

        /* ========== 定义模态框新样式 ========== */
        .def-header {
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .def-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin: 0 0 8px 0;
        }

        .def-phonetic {
            font-size: 16px;
            color: #667eea;
            font-style: italic;
        }

        .def-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .def-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .def-tag-ky { background: #e8f3ff; color: #0066cc; }
        .def-tag-cet4 { background: #fff4e6; color: #ff9900; }
        .def-tag-cet6 { background: #fff4e6; color: #ff6600; }
        .def-tag-zk { background: #f0e6ff; color: #6600cc; }
        .def-tag-gk { background: #e6f9ff; color: #0099cc; }
        .def-tag-ielts { background: #ffe6f0; color: #cc0066; }
        .def-tag-toefl { background: #ffe6f0; color: #cc0066; }

        .def-examples {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .def-example {
            background: #f8f9fa;
            padding: 12px;
            border-left: 3px solid #667eea;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .def-root-affix {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .def-root-affix span {
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #555;
        }

        .def-relations {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .def-relations div {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }

        .def-level {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }

        .def-level span {
            font-size: 13px;
            color: #666;
        }

        .loading-def {
            text-align: center;
            color: #667eea;
        }

        .stats {
            padding: 20px 30px;
            background: #f8f9fa;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .group-header {
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: #667eea;
            padding: 12px;
            margin-top: 20px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Loading 框 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <p>搜索中...</p>
        </div>
    </div>

    <!-- 单词定义 Modal -->
    <div class="definition-modal" id="definitionModal">
        <div class="definition-content">
            <button class="close-btn" onclick="closeDefinition()">×</button>
            <div id="definitionBody">
                <div class="loading-def">
                    <div class="spinner" style="margin: 20px auto;"></div>
                    <p>加载定义中...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📚 考研英语二真题单词频率统计</h1>
            <p>基于2010-2023年考研英语II真题的词汇分析系统</p>
        </div>

        <!-- 搜索区域 -->
        <div class="search-section">
            <div class="search-box-wrapper">
                <label class="search-label">🔍 搜索考研英语单词</label>
                <div class="search-input-container">
                    <input type="text" id="searchInput" class="search-input" 
                           placeholder="输入单词或词根 (如: improve, scenario, challenge)">
                </div>
            </div>

            <div class="controls">
                <div class="control-item">
                    <label for="minFrequency">最小频率:</label>
                    <input type="number" id="minFrequency" min="1" value="1" style="width: 70px;">
                </div>
                <div class="control-item">
                    <label for="sortBy">排序方式:</label>
                    <select id="sortBy">
                        <option value="frequency">按频率 ↓</option>
                        <option value="frequency-asc">按频率 ↑</option>
                        <option value="alpha">按字母 A-Z</option>
                        <option value="alpha-desc">按字母 Z-A</option>
                        <option value="random">随机打乱</option>
                        <option value="alpha-group">字母分组</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="pageSize">每页显示:</label>
                    <select id="pageSize">
                        <option value="20">20 条</option>
                        <option value="50">50 条</option>
                        <option value="100">100 条</option>
                        <option value="200">200 条</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 信息栏 -->
        <div class="info-bar">
            <div class="info-item">
                📊 搜索结果: <span class="info-value" id="resultCount">--</span>
            </div>
            <div class="info-item">
                ⭐ 已收藏: <span class="info-value" id="starredCount">0</span>
            </div>
            <div class="info-item">
                📖 总词汇: <span class="info-value" id="totalCount">--</span>
            </div>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="overall">总体统计</button>
            <button class="tab-btn" data-tab="yearly">按年份统计</button>
            <button class="tab-btn" data-tab="starred">我的收藏</button>
        </div>

        <!-- 总体统计 -->
        <div class="tab-content active" id="overallTab">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">⭐</th>
                            <th style="width: 50px;">排名</th>
                            <th style="width: 150px;">单词</th>
                            <th style="width: 80px;" class="sortable">频率</th>
                            <th>出现年份</th>
                        </tr>
                    </thead>
                    <tbody id="overallTableBody">
                        <tr class="no-results"><td colspan="5">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="overallPagination"></div>
        </div>

        <!-- 按年份统计 -->
        <div class="tab-content" id="yearlyTab">
            <div id="yearSelector" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;"></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">⭐</th>
                            <th style="width: 50px;">排名</th>
                            <th style="width: 150px;">单词</th>
                            <th style="width: 80px;">该年频率</th>
                            <th style="width: 80px;">总频率</th>
                            <th>出现年份</th>
                        </tr>
                    </thead>
                    <tbody id="yearlyTableBody">
                        <tr class="no-results"><td colspan="6">请选择年份</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="yearlyPagination"></div>
        </div>

        <!-- 我的收藏 -->
        <div class="tab-content" id="starredTab">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">⭐</th>
                            <th style="width: 50px;">排名</th>
                            <th style="width: 150px;">单词</th>
                            <th style="width: 80px;">频率</th>
                            <th>出现年份</th>
                        </tr>
                    </thead>
                    <tbody id="starredTableBody">
                        <tr class="no-results"><td colspan="5">还没有收藏单词呢，点击 ⭐ 来收藏</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalWordsCount">-</div>
                <div class="stat-label">总频数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="uniqueWordsCount">-</div>
                <div class="stat-label">不同单词</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="yearRangeText">-</div>
                <div class="stat-label">年份范围</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="pdfCountText">15</div>
                <div class="stat-label">真题套数</div>
            </div>
        </div>

        <div style="padding: 20px 30px; text-align: center; color: #999; font-size: 12px;">
            💡 提示：点击单词查看详细定义 | 点击 ⭐ 收藏重要词汇 | 使用搜索框快速查找
        </div>
    </div>

    <script>
        // ============ 全局数据 ============
        let allData = null;
        let filteredData = null;
        let starredWords = new Set(JSON.parse(localStorage.getItem('starredWords')) || []);
        let currentYear = null;
        let currentPage = 1;
        let pageSize = 50;
        let currentTab = 'overall';
        let viewMode = 'list'; // list 或 group

        // ============ 性能优化：缓存和反向索引 ============
        let wordToStemMap = new Map();  // 单词 -> stem（快速查询相关词）
        let relatedWordsCache = new Map();  // 单词 -> 相关词汇数组（缓存）

        // ============ 初始化 ============
        async function init() {
            try {
                const response = await fetch('/api/data');
                allData = await response.json();
                
                // 【性能优化】构建单词到 stem 的反向索引
                if (allData.stemToWords) {
                    for (const stem in allData.stemToWords) {
                        const words = allData.stemToWords[stem];
                        for (const word of words) {
                            wordToStemMap.set(word, stem);
                            relatedWordsCache.set(word, words);
                        }
                    }
                }
                
                // 初始化筛选数据
                filteredData = [...allData.words];
                
                // 绑定事件
                document.getElementById('searchInput').addEventListener('input', debounceSearch);
                document.getElementById('minFrequency').addEventListener('change', applyFilters);
                document.getElementById('sortBy').addEventListener('change', handleSortChange);
                document.getElementById('pageSize').addEventListener('change', (e) => {
                    pageSize = parseInt(e.target.value);
                    currentPage = 1;
                    applyFilters();
                });

                // 标签页切换
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', switchTab);
                });

                // 初始化年份选择器
                initYearSelector();

                // 更新统计信息
                updateStats();

                // 初始化表格
                renderOverallTable();
            } catch (error) {
                console.error('初始化失败:', error);
                alert('数据加载失败，请刷新页面重试');
            }
        }

        // ============ 搜索和过滤 ============
        function debounceSearch(e) {
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(() => {
                currentPage = 1;
                applyFilters();
            }, 300);
        }

        function applyFilters() {
            showLoading();
            
            setTimeout(() => {
                const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
                const minFreq = parseInt(document.getElementById('minFrequency').value) || 1;
                const sortBy = document.getElementById('sortBy').value;

                // 【优化】快速搜索索引：缓存搜索结果中的相关词汇
                const searchCache = new Map();

                // 过滤
                filteredData = allData.words.filter(item => {
                    // 搜索过滤
                    if (searchText) {
                        const word = item.word.toLowerCase();
                        const matchesWord = word.includes(searchText);
                        
                        if (!matchesWord) {
                            // 【优化】只在单词不匹配时才查询相关词汇
                            if (!searchCache.has(word)) {
                                const relatedWords = getAllRelatedWords(item.word);
                                searchCache.set(word, relatedWords.some(w => w.toLowerCase().includes(searchText)));
                            }
                            if (!searchCache.get(word)) return false;
                        }
                    }
                    
                    // 频率过滤
                    if (item.total < minFreq) return false;
                    
                    return true;
                });

                // 排序
                handleSort(sortBy);

                // 更新UI
                document.getElementById('resultCount').textContent = filteredData.length;

                // 渲染当前标签页
                const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
                if (activeTab === 'overall') {
                    renderOverallTable();
                } else if (activeTab === 'yearly') {
                    renderYearlyTable();
                } else if (activeTab === 'starred') {
                    renderStarredTable();
                }

                hideLoading();
            }, 100);
        }

        function handleSortChange(e) {
            currentPage = 1;
            const sortBy = e.target.value;
            
            if (sortBy === 'alpha-group') {
                viewMode = 'group';
            } else {
                viewMode = 'list';
                handleSort(sortBy);
            }
            
            applyFilters();
        }

        function handleSort(sortBy) {
            if (sortBy === 'frequency') {
                filteredData.sort((a, b) => b.total - a.total);
            } else if (sortBy === 'frequency-asc') {
                filteredData.sort((a, b) => a.total - b.total);
            } else if (sortBy === 'alpha') {
                filteredData.sort((a, b) => a.word.localeCompare(b.word));
            } else if (sortBy === 'alpha-desc') {
                filteredData.sort((a, b) => b.word.localeCompare(a.word));
            } else if (sortBy === 'random') {
                for (let i = filteredData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filteredData[i], filteredData[j]] = [filteredData[j], filteredData[i]];
                }
            }
        }

        // ============ 表格渲染 ============
        function renderOverallTable() {
            const tbody = document.getElementById('overallTableBody');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr class="no-results"><td colspan="5">没有找到匹配的单词</td></tr>';
                renderPagination('overallPagination', 0);
                return;
            }

            if (viewMode === 'group') {
                renderGroupedTable(tbody, 'overall');
            } else {
                renderPagedTable(tbody, filteredData, 'overall');
            }
        }

        function renderYearlyTable() {
            const tbody = document.getElementById('yearlyTableBody');
            tbody.innerHTML = '';

            if (!currentYear) {
                tbody.innerHTML = '<tr class="no-results"><td colspan="6">请选择年份</td></tr>';
                renderPagination('yearlyPagination', 0);
                return;
            }

            const yearlyData = filteredData.filter(item => item.years.includes(currentYear));
            
            if (yearlyData.length === 0) {
                tbody.innerHTML = '<tr class="no-results"><td colspan="6">该年份没有找到匹配的单词</td></tr>';
                renderPagination('yearlyPagination', 0);
                return;
            }

            yearlyData.sort((a, b) => (b.yearly[currentYear] || 0) - (a.yearly[currentYear] || 0));

            if (viewMode === 'group') {
                renderGroupedTable(tbody, 'yearly', yearlyData);
            } else {
                renderPagedTable(tbody, yearlyData, 'yearly');
            }
        }

        function renderStarredTable() {
            const tbody = document.getElementById('starredTableBody');
            tbody.innerHTML = '';

            const starredWords_ = filteredData.filter(item => starredWords.has(item.word));

            if (starredWords_.length === 0) {
                tbody.innerHTML = '<tr class="no-results"><td colspan="5">还没有收藏单词呢，点击 ⭐ 来收藏</td></tr>';
                return;
            }

            starredWords_.forEach((item, index) => {
                const yearBadges = item.years.map(y => `<span class="year-badge">${y}</span>`).join('');
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><button class="star-btn starred" onclick="toggleStar(event, '${item.word}')">★</button></td>
                    <td>${index + 1}</td>
                    <td><span class="word-cell" onclick="showDefinition('${item.word}')">${item.word}</span><div class="word-forms">词形: ${getAllRelatedWords(item.word).join(', ')}</div></td>
                    <td>${item.total}</td>
                    <td>${yearBadges}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderPagedTable(tbody, data, tabType) {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = data.slice(start, end);

            pageData.forEach((item, index) => {
                const yearBadges = item.years.map(y => `<span class="year-badge">${y}</span>`).join('');
                const isStarred = starredWords.has(item.word);
                const row = document.createElement('tr');
                
                if (tabType === 'overall') {
                    row.innerHTML = `
                        <td><button class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar(event, '${item.word}')">★</button></td>
                        <td>${start + index + 1}</td>
                        <td><span class="word-cell" onclick="showDefinition('${item.word}')">${item.word}</span><div class="word-forms">词形: ${getAllRelatedWords(item.word).join(', ')}</div></td>
                        <td>${item.total}</td>
                        <td>${yearBadges}</td>
                    `;
                } else if (tabType === 'yearly') {
                    const yearlyFreq = item.yearly[currentYear] || 0;
                    row.innerHTML = `
                        <td><button class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar(event, '${item.word}')">★</button></td>
                        <td>${start + index + 1}</td>
                        <td><span class="word-cell" onclick="showDefinition('${item.word}')">${item.word}</span><div class="word-forms">词形: ${getAllRelatedWords(item.word).join(', ')}</div></td>
                        <td>${yearlyFreq}</td>
                        <td>${item.total}</td>
                        <td>${yearBadges}</td>
                    `;
                }
                
                tbody.appendChild(row);
            });

            const paginationId = tabType === 'overall' ? 'overallPagination' : 'yearlyPagination';
            renderPagination(paginationId, data.length);
        }

        function renderGroupedTable(tbody, tabType, data = null) {
            const displayData = data || filteredData;
            const grouped = {};

            displayData.forEach(item => {
                const firstLetter = item.word.charAt(0).toUpperCase();
                if (!grouped[firstLetter]) {
                    grouped[firstLetter] = [];
                }
                grouped[firstLetter].push(item);
            });

            Object.keys(grouped).sort().forEach(letter => {
                const headerRow = document.createElement('tr');
                headerRow.innerHTML = `<td colspan="${tabType === 'overall' ? 5 : 6}" class="group-header">${letter}</td>`;
                tbody.appendChild(headerRow);

                grouped[letter].forEach((item, index) => {
                    const yearBadges = item.years.map(y => `<span class="year-badge">${y}</span>`).join('');
                    const isStarred = starredWords.has(item.word);
                    const row = document.createElement('tr');
                    
                    if (tabType === 'overall') {
                        row.innerHTML = `
                            <td><button class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar(event, '${item.word}')">★</button></td>
                            <td></td>
                            <td><span class="word-cell" onclick="showDefinition('${item.word}')">${item.word}</span><div class="word-forms">词形: ${getAllRelatedWords(item.word).join(', ')}</div></td>
                            <td>${item.total}</td>
                            <td>${yearBadges}</td>
                        `;
                    } else if (tabType === 'yearly') {
                        const yearlyFreq = item.yearly[currentYear] || 0;
                        row.innerHTML = `
                            <td><button class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar(event, '${item.word}')">★</button></td>
                            <td></td>
                            <td><span class="word-cell" onclick="showDefinition('${item.word}')">${item.word}</span><div class="word-forms">词形: ${getAllRelatedWords(item.word).join(', ')}</div></td>
                            <td>${yearlyFreq}</td>
                            <td>${item.total}</td>
                            <td>${yearBadges}</td>
                        `;
                    }
                    
                    tbody.appendChild(row);
                });
            });
        }

        function renderPagination(containerId, totalItems) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (viewMode === 'group') {
                return; // 分组模式不显示分页
            }

            if (totalItems <= pageSize) {
                return;
            }

            const totalPages = Math.ceil(totalItems / pageSize);

            // 上一页
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '< 上一页';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    applyFilters();
                    window.scrollTo(0, 0);
                }
            };
            container.appendChild(prevBtn);

            // 页码
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = i === currentPage ? 'active' : '';
                btn.onclick = () => {
                    currentPage = i;
                    applyFilters();
                    window.scrollTo(0, 0);
                };
                container.appendChild(btn);
            }

            // 下一页
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '下一页 >';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    applyFilters();
                    window.scrollTo(0, 0);
                }
            };
            container.appendChild(nextBtn);

            // 页码信息
            const info = document.createElement('span');
            info.className = 'page-info';
            info.textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
            container.appendChild(info);
        }

        // ============ 年份选择 ============
        function initYearSelector() {
            const yearSelector = document.getElementById('yearSelector');
            const years = allData.yearRange;
            
            for (let year = years[0]; year <= years[1]; year++) {
                const btn = document.createElement('button');
                btn.className = 'year-btn';
                btn.textContent = year;
                if (year === years[0]) btn.classList.add('active');
                btn.onclick = () => {
                    document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentYear = year;
                    currentPage = 1;
                    applyFilters();
                };
                yearSelector.appendChild(btn);
            }
            
            currentYear = years[0];
        }

        // ============ 单词定义 ============
        async function showDefinition(word) {
            console.log('[showDefinition] 调用, word:', word);
            const modal = document.getElementById('definitionModal');
            if (!modal) { console.error('[showDefinition] 找不到 definitionModal!'); return; }
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            const defBody = document.getElementById('definitionBody');
            
            // 显示加载中
            defBody.innerHTML = `
                <div class="loading-def">
                    <div class="spinner" style="margin: 20px auto;"></div>
                    <p>加载定义中...</p>
                </div>
            `;
            
            try {
                const url = `/api/definition/${encodeURIComponent(word)}`;
                console.log('[showDefinition] 请求 URL:', url);
                const response = await fetch(url);
                console.log('[showDefinition] 响应状态:', response.status);
                const data = await response.json();
                
                if (data.error || data.definition === '词典中未找到此单词') {
                    defBody.innerHTML = `<p style="color: #999; padding: 20px; text-align: center;">😅 暂无定义</p>`;
                    return;
                }

                // 若 pos 为空，从 translation 提取 (如 "n. 部门" → "n.")
                if (!data.partOfSpeech && data.meaning) {
                    const m = data.meaning.match(/^([a-z]+\.(?:\s*[a-z]+\.)*)/i);
                    if (m) data.partOfSpeech = m[1];
                }

                // translation 中 \n 换成 <br>，去掉医学标注
                if (data.meaning) {
                    data.meaning = data.meaning.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                }
                if (data.definition) {
                    data.definition = data.definition.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                }

                // 标签映射表（ECDICT 标签是空格分隔的一个字符串，需展开）
                const tagMap = {
                    'ky': { icon: '📚', label: '考研' },
                    'cet4': { icon: '🎯', label: 'CET4' },
                    'cet6': { icon: '🎓', label: 'CET6' },
                    'zk': { icon: '📖', label: '中考' },
                    'gk': { icon: '📗', label: '高考' },
                    'ielts': { icon: '🌐', label: '雅思' },
                    'toefl': { icon: '🌐', label: '托福' },
                    'gre': { icon: '🎓', label: 'GRE' },
                    'tg': { icon: '📊', label: '商务' }
                };

                // 展开标签（每个 tag 元素可能是 "cet4 cet6 ky" 这样的空格字符串）
                let allTags = [];
                if (data.tags && data.tags.length > 0) {
                    data.tags.forEach(t => allTags.push(...t.split(/\s+/).filter(Boolean)));
                }

                // 生成标签 HTML
                let tagsHtml = '';
                if (allTags.length > 0) {
                    const tagElements = allTags.map(tag => {
                        const info = tagMap[tag] || null;
                        if (!info) return '';
                        return `<span class="def-tag def-tag-${tag}">${info.icon} ${info.label}</span>`;
                    }).filter(Boolean).join('');
                    if (tagElements) tagsHtml = `<div class="def-tags">${tagElements}</div>`;
                }
                
                // 生成例句 HTML
                let examplesHtml = '';
                if (data.examples && data.examples.length > 0) {
                    const exampleList = data.examples.map(ex => `<div class="def-example">• ${ex}</div>`).join('');
                    examplesHtml = `
                        <div class="definition-section">
                            <div class="definition-label">📖 例句</div>
                            <div class="def-examples">${exampleList}</div>
                        </div>
                    `;
                }
                
                // 生成词形变化 HTML
                let formsHtml = '';
                if (data.forms && data.forms.length > 0) {
                    formsHtml = `
                        <div class="definition-section">
                            <div class="definition-label">🔄 词形变化</div>
                            <div class="definition-text">${data.forms.join(', ')}</div>
                        </div>
                    `;
                }
                
                // 生成词根词缀 HTML
                let rootAffixHtml = '';
                if (data.wordRoot || data.affixes) {
                    let content = '';
                    if (data.wordRoot) content += `<span>📍 词根: ${data.wordRoot}</span>`;
                    if (data.affixes) content += `<span>📍 词缀: ${data.affixes}</span>`;
                    rootAffixHtml = `
                        <div class="definition-section">
                            <div class="definition-label">🔗 词根词缀</div>
                            <div class="def-root-affix">${content}</div>
                        </div>
                    `;
                }
                
                // 生成近反义词 HTML
                let synonymHtml = '';
                if (data.synonyms || data.antonyms) {
                    let content = '';
                    if (data.synonyms) content += `<div><strong>同义词:</strong> ${data.synonyms}</div>`;
                    if (data.antonyms) content += `<div><strong>反义词:</strong> ${data.antonyms}</div>`;
                    synonymHtml = `
                        <div class="definition-section">
                            <div class="definition-label">🔀 相关词汇</div>
                            <div class="def-relations">${content}</div>
                        </div>
                    `;
                }
                
                // 生成星级 HTML
                let levelHtml = '';
                if (data.collins || data.oxford) {
                    let content = '';
                    if (data.collins) {
                        const stars = '⭐'.repeat(Math.min(data.collins, 5));
                        content += `<span>📊 柯林斯: ${stars}</span>`;
                    }
                    if (data.oxford && data.oxford !== '0') {
                        content += `<span>📚 牛津核心词汇 ✓</span>`;
                    }
                    if (content) levelHtml = `<div class="def-level">${content}</div>`;
                }
                
                // 组合完整 HTML
                defBody.innerHTML = `
                    <div class="def-header">
                        <h2>${data.word}</h2>
                        ${data.phonetic ? `<div class="def-phonetic">${data.phonetic}</div>` : ''}
                    </div>
                    
                    ${tagsHtml}
                    
                    ${data.partOfSpeech ? `
                        <div class="definition-section">
                            <div class="definition-label">📝 词性</div>
                            <div class="definition-text">${data.partOfSpeech}</div>
                        </div>
                    ` : ''}
                    
                    ${data.meaning ? `
                        <div class="definition-section">
                            <div class="definition-label">🇨🇳 中文释义</div>
                            <div class="definition-text">${data.meaning}</div>
                        </div>
                    ` : ''}
                    
                    ${data.definition ? `
                        <div class="definition-section">
                            <div class="definition-label">🇬🇧 英文定义</div>
                            <div class="definition-text">${data.definition}</div>
                        </div>
                    ` : ''}
                    
                    ${examplesHtml}
                    ${formsHtml}
                    ${rootAffixHtml}
                    ${synonymHtml}
                    ${levelHtml}
                `;
            } catch (error) {
                console.error('[showDefinition] 加载失败:', error);
                defBody.innerHTML = `<p style="color: #cc0000; padding: 20px; text-align: center;">❌ 加载失败: ${error.message}<br><small>请按 F12 查看 Console 标签</small></p>`;
            }
        }

        function closeDefinition() {
            document.getElementById('definitionModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============ 收藏功能 ============
        function toggleStar(event, word) {
            event.stopPropagation();
            const btn = event.target;
            
            if (starredWords.has(word)) {
                starredWords.delete(word);
                btn.classList.remove('starred');
            } else {
                starredWords.add(word);
                btn.classList.add('starred');
            }
            
            localStorage.setItem('starredWords', JSON.stringify([...starredWords]));
            document.getElementById('starredCount').textContent = starredWords.size;
        }

        // ============ 标签页切换 ============
        function switchTab(e) {
            const tabName = e.target.dataset.tab;
            currentPage = 1;
            currentTab = tabName;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            e.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');

            if (tabName === 'overall') {
                renderOverallTable();
            } else if (tabName === 'yearly') {
                renderYearlyTable();
            } else if (tabName === 'starred') {
                renderStarredTable();
            }
        }

        // ============ 工具函数 ============
        function getAllRelatedWords(word) {
            // 【性能优化】使用缓存，O(1) 时间复杂度，而非 O(stems × words_per_stem)
            if (relatedWordsCache.has(word)) {
                return relatedWordsCache.get(word);
            }
            return [word];
        }

        function updateStats() {
            document.getElementById('totalWordsCount').textContent = allData.totalWords.toLocaleString();
            document.getElementById('uniqueWordsCount').textContent = allData.uniqueWords.toLocaleString();
            document.getElementById('yearRangeText').textContent = 
                `${allData.yearRange[0]}-${allData.yearRange[1]}`;
            document.getElementById('resultCount').textContent = allData.words.length;
            document.getElementById('starredCount').textContent = starredWords.size;
            document.getElementById('totalCount').textContent = allData.words.length;
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 页面加载完成时初始化
        window.addEventListener('load', init);

        // 点击 modal 外部关闭
        document.getElementById('definitionModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('definitionModal')) {
                closeDefinition();
            }
        });
    </script>
</body>
</html>
